name: cloud-lab04-hub

services:
  backend:
    image: phantuananhnct/mern-backend:1.0
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}

  frontend:
    image: phantuananhnct/mern-frontend:2.0
    ports:
      - "5173:80"
    depends_on:
      - backend
