name: cloud-lab-production

services:
  backend:
    image: phantuananhnct/mern-backend:2.0
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in .env}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}

  frontend:
    image: phantuananhnct/mern-frontend:3.1
    ports:
      - "5173:80"
    environment:
      BACKEND_URL: http://backend:5000
    depends_on:
      - backend
